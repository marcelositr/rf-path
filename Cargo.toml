[package]
name = "rf-path"
version = "0.1.0"
edition = "2021"
description = "Offline terrain-aware RF path analysis using local SRTM/DEM data"
license = "MIT"
repository = "https://github.com/marcelositr/rf-path"
readme = "README.md"
keywords = ["rf", "srtm", "terrain", "radio", "cli"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "line_series"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
geojson = "0.24"
thiserror = "2.0"

[dev-dependencies]
approx = "0.5"

[[bench]]
name = "srtm_access"
harness = false
